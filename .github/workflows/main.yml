name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract Project Zip
      run: |
        unzip BEKA_Academy_Android_Source.zip
        # التبديل إلى المجلد المستخرج إذا كان بداخل مجلد فرعي
        if [ -d "BEKA_Academy_Android_Source" ]; then
          cd BEKA_Academy_Android_Source
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        chmod +x gradlew || true
        chmod +x BEKA_Academy_Android_Source/gradlew || true
      continue-on-error: true

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "BEKA_Academy_Android_Source/gradlew" ]; then
          cd BEKA_Academy_Android_Source && ./gradlew assembleDebug
        else
          echo "Gradlew not found, trying global gradle"
          gradle assembleDebug
        fi
      continue-on-error: true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-game-apk
        path: |
          **/build/outputs/apk/debug/*.apk
